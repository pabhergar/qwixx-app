name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Las ramas que no son main se publican como snapshot en /preview/<rama>/,
      # manteniendo la release (/) y la integración (/test) con el contenido de main
      - name: Publicar snapshot de rama
        if: github.ref != 'refs/heads/main'
        run: |
          SLUG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          mkdir -p /tmp/snap
          cp -r dist/. /tmp/snap/
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          mkdir -p "dist/preview/$SLUG"
          cp -r /tmp/snap/. "dist/preview/$SLUG/"
          echo "::notice::Preview disponible en /preview/$SLUG/ (y /preview/$SLUG/test/)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
